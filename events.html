<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Events | Meet your neighborhood</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="navbar">
        <a href="index.html" class="logo">
            Meet <strong>your</strong> neighborhood.
        </a>
        <nav>
            <a href="login.html" class="nav-link">Log in / Sign up</a>
            <a href="about.html" class="nav-link">About</a>
        </nav>
    </header>

    <main class="events-main">
        <div class="events-header">
            <h1>Here's what we found <strong>for you</strong> nearby:</h1>
            <div class="controls">
                <div class="control-group">
                    <button class="btn-control">Sort by <i class="fa-solid fa-chevron-down"></i></button>
                </div>
                <div class="control-group">
                    <button class="btn-control">Filter by <i class="fa-solid fa-chevron-down"></i></button>
                </div>
                <div class="control-group">
                    <a href="create-event.html" class="btn-control"
                        style="background-color: white; color: var(--nav-bg); border: 2px solid var(--nav-bg);">
                        <i class="fa-solid fa-plus"></i> Create Event
                    </a>
                </div>
            </div>
        </div>

        <div class="events-grid" id="events-grid">
            <!-- Events will be loaded here dynamically -->
        </div>
    </main>

    <footer class="site-footer">
        <p>We value your privacy and are committed to protecting your personal information. Click <a href="#">here</a>
            to view our full Privacy Policy.</p>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const grid = document.getElementById('events-grid');
            try {
                const response = await fetch('/api/events');
                const data = await response.json();
                
                if (response.ok) {
                    grid.innerHTML = '';
                    if (data.events.length === 0) {
                        grid.innerHTML = '<p style="grid-column: 1 / -1; text-align: center;">No events found. Be the first to create one!</p>';
                        return;
                    }

                    data.events.forEach(event => {
                        const costDisplay = event.cost > 0 ? `$${event.cost.toFixed(2)}` : 'Free';
                        const imageHtml = event.image_url 
                            ? `<img src="${event.image_url}" alt="${event.title}" style="width: 100%; height: 200px; object-fit: cover; border-radius: 8px 8px 0 0;">` 
                            : `<div class="event-map-placeholder"><i class="fa-solid fa-location-dot"></i></div>`;

                        const card = document.createElement('article');
                        card.className = 'event-card';
                        card.innerHTML = `
                            ${imageHtml}
                            <h3 class="event-title" style="padding: 1rem 1rem 0;">${event.title}</h3>
                            <div class="event-details" style="padding: 1rem;">
                                <p><strong>Date:</strong> ${new Date(event.date).toLocaleString()}</p>
                                <p><strong>Cost:</strong> ${costDisplay}</p>
                                <p><strong>Location:</strong> ${event.location}</p>
                                <p><strong>Description:</strong> ${event.description}</p>
                            </div>
                            <button class="btn-join" onclick="joinEvent(${event.id})">Join</button>
                        `;
                        grid.appendChild(card);
                    });
                } else {
                    grid.innerHTML = '<p>Error loading events.</p>';
                }
            } catch (error) {
                console.error('Failed to load events', error);
                grid.innerHTML = '<p>Failed to load events.</p>';
            }
        });

        async function joinEvent(eventId) {
            const token = localStorage.getItem('token');
            if (!token) {
                alert('You must be logged in to join an event.');
                window.location.href = 'login.html';
                return;
            }

            try {
                const response = await fetch(`/api/events/${eventId}/join`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await response.json();
                
                if (response.ok) {
                    alert('Successfully joined the event!');
                } else {
                    alert(data.error || 'Failed to join event');
                }
            } catch (error) {
                console.error('Error joining event:', error);
                alert('An error occurred.');
            }
        }
    </script>
</body>

</html>
