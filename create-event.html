<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Event | Meet your neighborhood</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="navbar">
        <a href="index.html" class="logo">
            Meet <strong>your</strong> neighborhood.
        </a>
        <nav>
            <a href="events.html" class="nav-link">Events</a>
            <a href="login.html" class="nav-link">Log in / Sign up</a>
            <a href="about.html" class="nav-link">About</a>
        </nav>
    </header>

    <main class="create-event-main">
        <div class="form-container">
            <form id="create-event-form" class="auth-form">
                <h2>Create New Event</h2>

                <div class="form-group">
                    <label for="event-title">Event Title</label>
                    <input type="text" id="event-title" placeholder="e.g. Community BBQ" required>
                </div>

                <div class="form-group">
                    <label for="event-date">Date & Time</label>
                    <input type="datetime-local" id="event-date" required>
                </div>

                <div class="form-group">
                    <label for="event-location">Location</label>
                    <input type="text" id="event-location" placeholder="e.g. Central Park" required>
                </div>

                <div class="form-group">
                    <label for="event-cost">Cost ($)</label>
                    <input type="number" id="event-cost" placeholder="0 for free" min="0" step="0.01">
                </div>

                <div class="form-group">
                    <label for="event-description">Description</label>
                    <textarea id="event-description" rows="4" placeholder="Describe your event..." required></textarea>
                </div>

                <div class="form-group">
                    <label for="event-image">Event Image</label>
                    <input type="file" id="event-image" accept="image/*">
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary btn-block">Publish Event</button>
                    <a href="events.html" class="btn-cancel">Cancel</a>
                </div>
            </form>
        </div>
    </main>

    <footer class="site-footer">
        <p>We value your privacy and are committed to protecting your personal information. Click <a href="#">here</a>
            to
            view our full Privacy Policy.</p>
    </footer>

    <script>
        // Check authentication
        if (!localStorage.getItem('token')) {
            alert('Please log in first to create an event.');
            window.location.href = 'login.html';
        }

        document.getElementById('create-event-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const token = localStorage.getItem('token');
            if (!token) {
                alert('You must be logged in to create an event.');
                window.location.href = 'login.html';
                return;
            }

            const formData = new FormData();
            formData.append('title', document.getElementById('event-title').value);
            formData.append('date', document.getElementById('event-date').value);
            formData.append('location', document.getElementById('event-location').value);
            formData.append('cost', document.getElementById('event-cost').value || '0');
            formData.append('description', document.getElementById('event-description').value);
            
            const imageFile = document.getElementById('event-image').files[0];
            if (imageFile) {
                formData.append('image', imageFile);
            }

            try {
                const response = await fetch('/api/events', {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` },
                    body: formData
                });
                const data = await response.json();
                
                if (response.ok) {
                    alert('Event created successfully!');
                    window.location.href = 'events.html';
                } else {
                    alert(data.error || 'Failed to create event');
                }
            } catch (error) {
                console.error('Error creating event:', error);
                alert('An error occurred.');
            }
        });
    </script>
</body>

</html>
