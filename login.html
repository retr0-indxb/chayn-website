<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In | Meet your neighborhood</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="navbar">
        <a href="index.html" class="logo">
            Meet <strong>your</strong> neighborhood.
        </a>
        <nav>
            <a href="events.html" class="nav-link">Events</a>
            <a href="login.html" class="nav-link active">Log in / Sign up</a>
            <a href="about.html" class="nav-link">About</a>
        </nav>
    </header>

    <main class="login-main">
        <div class="form-container">
            <div class="form-toggle">
                <button id="login-toggle" class="toggle-btn active" onclick="showForm('login')">Log In</button>
                <button id="signup-toggle" class="toggle-btn" onclick="showForm('signup')">Sign Up</button>
            </div>

            <!-- Login Form -->
            <form id="login-form" class="auth-form">
                <h2>Welcome Back!</h2>
                <div class="form-group">
                    <label for="login-email">Email Address</label>
                    <input type="email" id="login-email" placeholder="you@example.com" required>
                </div>
                <div class="form-group">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" placeholder="••••••••" required>
                </div>
                <a href="#" class="forgot-password">Forgot password?</a>
                <button type="submit" class="btn btn-primary btn-block">Log In</button>
            </form>

            <!-- Sign Up Form (Hidden by default) -->
            <form id="signup-form" class="auth-form hidden">
                <h2>Join the Community</h2>
                <div class="form-group">
                    <label for="signup-name">Full Name</label>
                    <input type="text" id="signup-name" placeholder="John Doe" required>
                </div>
                <div class="form-group">
                    <label for="signup-email">Email Address</label>
                    <input type="email" id="signup-email" placeholder="you@example.com" required>
                </div>
                <div class="form-group">
                    <label for="signup-password">Password</label>
                    <input type="password" id="signup-password" placeholder="Create a password" required>
                </div>
                <div class="form-group">
                    <label for="signup-confirm">Confirm Password</label>
                    <input type="password" id="signup-confirm" placeholder="Confirm password" required>
                </div>
                <button type="submit" class="btn btn-primary btn-block">Sign Up</button>
            </form>
        </div>
    </main>

    <footer class="site-footer">
        <p>We value your privacy and are committed to protecting your personal information. Click <a href="#">here</a>
            to
            view our full Privacy Policy.</p>
    </footer>

    <script>
        function showForm(formType) {
            const loginForm = document.getElementById('login-form');
            const signupForm = document.getElementById('signup-form');
            const loginToggle = document.getElementById('login-toggle');
            const signupToggle = document.getElementById('signup-toggle');

            if (formType === 'login') {
                loginForm.classList.remove('hidden');
                signupForm.classList.add('hidden');
                loginToggle.classList.add('active');
                signupToggle.classList.remove('active');
            } else {
                loginForm.classList.add('hidden');
                signupForm.classList.remove('hidden');
                loginToggle.classList.remove('active');
                signupToggle.classList.add('active');
            }
        }
    </script>

</body>

</html>
